name: Generate Asset Vault

on:
  push:
    paths:
      - 'tools/bootstrap_vault.py'
      - '.github/workflows/generate-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python3 -m pip install --no-cache-dir pillow

      - name: Generate TacPlanShooter asset vault
        run: python3 tools/bootstrap_vault.py

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "feat(tacplanshooter): populate initial 2D textures, tilesets, sprites, UI icons, shaders, theme, and SFX"
            git push
          fi
